<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SearchLab · Search</title><style>body{font-family:system-ui;background:#f5f7f0;color:#20382b;margin:0}main{max-width:850px;margin:80px auto;padding:25px}h1{font-size:44px;letter-spacing:-2px;margin-bottom:10px}p{color:#7a8a6f;line-height:1.7}form{display:flex;gap:10px;margin:30px 0}input{flex:1;min-width:0;padding:16px;border:1px solid #cddbc0;border-radius:8px;font:inherit}button{border:0;background:#285e41;color:white;padding:12px 24px;border-radius:8px;font:inherit}article{background:white;border:1px solid #e0e7d8;padding:24px;border-radius:9px;margin:14px 0}h2{font-size:19px;margin:0 0 8px}a{color:#376c42}small{color:#87977a}#status{font-size:12px}</style><main><small>FOUR NODES. A WORLD OF KNOWLEDGE.</small><h1>SearchLab</h1><p>A small search engine, built together.</p><form id="form"><input id="q" placeholder="What are you curious about?" aria-label="Search query" required maxlength="300"><button>Search →</button></form><div id="status" role="status"></div><section id="results"></section></main><script>
const status=document.querySelector('#status'),results=document.querySelector('#results');
fetch('/health').then(r=>r.json()).then(x=>status.textContent=x.ready?'Serving '+x.version+' · '+x.documents+' documents':'Waiting for a validated export.');
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();status.textContent='Searching…';results.replaceChildren();try{const r=await fetch('/search?q='+encodeURIComponent(document.querySelector('#q').value));const x=await r.json();if(!r.ok)throw Error(x.error||'Search unavailable');status.textContent=x.results.length+' results · '+x.version+' · snapshot '+x.snapshot_id;for(const row of x.results){const article=document.createElement('article'),title=document.createElement('h2'),link=document.createElement('a'),snippet=document.createElement('p'),meta=document.createElement('small');link.textContent=row.title;const url=new URL(row.url);if(['http:','https:'].includes(url.protocol)){link.href=url.href;link.target='_blank';link.rel='noreferrer';}title.append(link);snippet.textContent=row.snippet;meta.textContent='Document '+row.doc_id+' · score '+row.final_score.toFixed(4)+' · BM25 '+row.bm25.toFixed(3)+' · PageRank '+row.pagerank.toFixed(6);article.append(title,snippet,meta);results.append(article);}}catch(e){status.textContent=e.message;}});
</script></html>
